name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify Node ${{ matrix.node-version }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # The Hybrid Link SDK contract is in a companion PR. Verify this PR against
      # that immutable source revision until its package is published.
      - run: npm ci --ignore-scripts
      - uses: actions/checkout@v6
        with:
          repository: polymorfa/sdks
          ref: 029e0e742692e20a3f88e957b66831fb5e94038b
          path: .sdk-source
      - run: npm ci
        working-directory: .sdk-source
      - run: npm run build -w @polymorfa/sdk
        working-directory: .sdk-source
      - run: npm pack -w @polymorfa/sdk --pack-destination .. --ignore-scripts
        working-directory: .sdk-source
      - run: npm install --no-save --package-lock=false --ignore-scripts ./polymorfa-sdk-*.tgz
      - run: npm run build
      - run: npm run verify
