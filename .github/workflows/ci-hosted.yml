name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cli-hosted-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - id: source-sdk
        run: node scripts/source-sdk.mjs --github-output
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.source-sdk.outputs.source_only == 'true'
        with:
          repository: polymorfa/sdks
          ref: ${{ steps.source-sdk.outputs.ref }}
          path: .sdk-source/repo
          persist-credentials: false
      - if: steps.source-sdk.outputs.source_only == 'true'
        run: npm ci --ignore-scripts
        working-directory: .sdk-source/repo
      - if: steps.source-sdk.outputs.source_only == 'true'
        run: npm run ci:sdk-source -- --sdk-root .sdk-source/repo
      - run: npm run verify
      - run: node --test scripts/release-evidence.test.mjs

  windows-agent-process:
    name: Windows agent process lifecycle
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - id: source-sdk
        run: node scripts/source-sdk.mjs --github-output
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.source-sdk.outputs.source_only == 'true'
        with:
          repository: polymorfa/sdks
          ref: ${{ steps.source-sdk.outputs.ref }}
          path: .sdk-source/repo
          persist-credentials: false
      - if: steps.source-sdk.outputs.source_only == 'true'
        run: npm ci --ignore-scripts
        working-directory: .sdk-source/repo
      - if: steps.source-sdk.outputs.source_only == 'true'
        run: npm run ci:sdk-source -- --sdk-root .sdk-source/repo
      - run: npm run build
      - run: node --test --test-concurrency=1 test/windows/agent-process.native.mjs
