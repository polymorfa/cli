name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify Node ${{ matrix.node-version }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'ci1-integration' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
    steps:
      - name: Require trusted source
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request && "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
            echo 'Fork PRs require a separately qualified runner policy' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require qualified ci-1 image
        run: |
          python3 scripts/verify-ci1-image.py
          sha256sum --check --strict /etc/ci1-image/manifests.sha256
      - name: Test image admission refusals
        run: python3 -m unittest discover -s scripts -p ci1_image_test.py -v
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: node --test scripts/release-evidence.test.mjs
